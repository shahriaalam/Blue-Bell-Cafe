<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- Primary Page SEO -->
  <title>Blue Bell Café</title>
  <meta name="title" content="Blue Bell Café — Artisanal Coffee &amp; Roastery | Gulshan, Dhaka">
  <meta name="description"
    content="Experience the romantic story of artisanal coffee at Blue Bell Café in Gulshan, Dhaka. Explore our 8-chapter roasting ritual, curated bistro menu, and candlelit table service with Mr. Pudding.">
  <meta name="keywords"
    content="Blue Bell Cafe, Dhaka cafe, Gulshan roastery, specialty coffee Bangladesh, pour-over coffee, artisan bistro, Mr Pudding cat cafe, luxury dining Dhaka">
  <meta name="author" content="Blue Bell Café">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#231610">
  <meta name="color-scheme" content="light dark">

  <!-- Favicons & Touch Icons -->
  <link rel="icon" type="image/jpeg" href="assets/Logo and falcon/Falcon.jpg">
  <link rel="apple-touch-icon" href="assets/Logo and falcon/Falcon.jpg">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Blue Bell Café">
  <meta property="og:title" content="Blue Bell Café — Artisanal Roastery &amp; Cinematic Coffee House">
  <meta property="og:description"
    content="From handpicked roasted beans to the warmth of your candlelit table. Explore our seasonal sips, bistro kitchen, and reserve your table in Gulshan.">
  <meta property="og:image" content="assets/stills/08_service.png">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Blue Bell Café — Artisanal Roastery &amp; Cinematic Coffee House">
  <meta name="twitter:description"
    content="Step into Gulshan's cinematic specialty coffee sanctuary. Taste single-origin micro-lots, Tuscan lasagna, and reserve your table with Mr. Pudding.">
  <meta name="twitter:image" content="assets/stills/08_service.png">

  <!-- Performance: Resource Hints & Font Preconnects -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&display=swap"
    rel="stylesheet">

  <!-- Core Stylesheet & Sub-stylesheets -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="story/story.css">
  <link rel="stylesheet" href="menu/menu.css">

  <!-- High Priority Preloads for Instant Hero Experience -->
  <link rel="preload" href="assets/stills/01_selection.png" as="image" fetchpriority="high">
  <link rel="preload" href="assets/vid/01_selection.mp4" as="video" type="video/mp4" fetchpriority="high">

  <!-- Instant Prefetch for Table Reservation Parlour -->
  <link rel="prefetch" href="reservation/reservation.html">
  <link rel="prefetch" href="reservation/reservation.css">
  <link rel="prefetch" href="reservation/reservation.js">

  <!-- Structured Data (JSON-LD) for Local Business / Cafe -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CafeOrCoffeeShop",
    "name": "Blue Bell Café",
    "image": "assets/stills/08_service.png",
    "description": "Artisanal coffee roastery, specialty espresso bar, bistro kitchen, and intimate lounge in Gulshan, Dhaka.",
    "servesCuisine": ["Specialty Coffee", "Italian Bistro", "European Pastries", "American Brunch"],
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Gulshan-2",
      "addressRegion": "Dhaka",
      "addressCountry": "BD"
    },
    "priceRange": "৳৳",
    "openingHours": "Mo-Su 08:00-23:00"
  }
  </script>
</head>

<body>
  <!-- Page Entrance / Exit Crossfade Veil with Artisanal Steaming Coffee Loader -->
  <div class="page-transition-veil" id="page-transition-veil" aria-hidden="true">
    <div class="coffee-loader">
      <div class="coffee-cup-box">
        <svg class="coffee-cup-art" viewBox="0 0 100 100" width="84" height="84" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <!-- Rising Steam Tendrils -->
          <g class="steam-group">
            <path class="steam-trail s1" d="M36 34 C33 24, 40 16, 36 6" stroke="#D4AF37" stroke-width="2.5"
              stroke-linecap="round" fill="none" />
            <path class="steam-trail s2" d="M50 30 C53 20, 47 12, 51 3" stroke="#E2A76F" stroke-width="2.8"
              stroke-linecap="round" fill="none" />
            <path class="steam-trail s3" d="M64 34 C67 24, 60 16, 64 6" stroke="#D4AF37" stroke-width="2.5"
              stroke-linecap="round" fill="none" />
          </g>
          <!-- Elegant Saucer Plate -->
          <ellipse cx="50" cy="85" rx="36" ry="6" fill="#EDE4D8" stroke="#C49A6C" stroke-width="2" />
          <ellipse cx="50" cy="84" rx="28" ry="4" fill="#FAF6F0" />
          <!-- Ceramic Cup Outer Silhouette -->
          <path d="M22 42 C22 72, 32 82, 50 82 C68 82, 78 72, 78 42 Z" fill="#FFFDF9" stroke="#C49A6C"
            stroke-width="2.2" />
          <!-- Inner Coffee Surface & Rim -->
          <ellipse cx="50" cy="42" rx="28" ry="6.5" fill="#FAF6F0" stroke="#C49A6C" stroke-width="2.2" />
          <ellipse cx="50" cy="43" rx="24" ry="5" fill="#5A2E17" />
          <!-- Latte Art Rosette / Heart -->
          <path class="coffee-heart" d="M46 42 Q50 45 54 42 Q50 40 46 42 Z" fill="#FFF2E5" opacity="0.9" />
          <!-- Ergonomic Ceramic Handle -->
          <path d="M75 48 C90 48, 90 70, 72 72" stroke="#C49A6C" stroke-width="3.5" stroke-linecap="round"
            fill="none" />
          <path d="M75 51 C85 51, 85 67, 72 69" stroke="#FAF6F0" stroke-width="1.8" stroke-linecap="round"
            fill="none" />
        </svg>
        <div class="cup-ambient-glow"></div>
      </div>
      <div class="loader-caption">
        <span class="loader-status">Pouring Table Ambience...</span>
        <span class="loader-detail">Preparing your candlelit table with Mr. Pudding</span>
      </div>
    </div>
  </div>

  <div id="top"></div>
  <div class="ambient-vignette"></div>

  <!-- ======================================================================
       1. STORY SECTION (8-Act Scroll-Scrubbed Camera Flight)
       Configuration & styling housed in story/story.js & story/story.css
       ====================================================================== -->
  <div id="story-mount">
    <div id="world"></div>
  </div>

  <!-- ======================================================================
       2. ARTISANAL MENU & FOOTER SECTION
       Markup, styling & logic housed in menu/menu.html, menu/menu.css, menu/menu.js
       ====================================================================== -->
  <div id="menu-mount"></div>

  <!-- Core Camera Flight Scrub Engine -->
  <script src="scrub-engine.js"></script>

  <!-- Modular Sub-Scripts -->
  <script src="story/story.js"></script>
  <script src="menu/menu.js"></script>

  <!-- Main Client Orchestrator -->
  <script src="main.js"></script>
</body>

</html>
